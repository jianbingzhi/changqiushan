services:
  # B 端后台应用(Next 16 生产构建)。QA/联调用,完全容器化跑全栈。
  # 构建是重活:按 CLAUDE.md「编译/打包纪律」先 down 释放内存再 build app,再 up。
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* 构建期内联,从宿主 env 透传(不设=空=地图「Key 未配置」诚实态)
      args:
        NEXT_PUBLIC_AMAP_KEY: ${NEXT_PUBLIC_AMAP_KEY:-}
        NEXT_PUBLIC_AMAP_SECURITY: ${NEXT_PUBLIC_AMAP_SECURITY:-}
    image: changqiushan-app:latest
    container_name: changqiushan-app
    restart: unless-stopped
    # 运行期(next start)内存占用温和;构建期重活在 image build 阶段,不受此 limit 约束
    cpus: 1.0
    mem_limit: 640m
    mem_reservation: 256m
    depends_on:
      postgres:
        condition: service_healthy
      gotrue:
        condition: service_started
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      # 容器内网:DB 主机名=postgres、端口=5432(非宿主映射的 5433)
      DATABASE_URL: postgresql://changqiushan:changqiushan_dev@postgres:5432/changqiushan?schema=public
      # fetch GoTrue 走容器内网名;但 issuer 必须仍 = GoTrue 签发的 iss(localhost:9999),否则验签拒所有真实 token
      GOTRUE_URL: http://gotrue:9999
      GOTRUE_JWT_ISSUER: http://localhost:9999
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
      # B16:cookie 寿命与 GoTrue JWT 寿命对齐(下方 gotrue 服务同值),消除提前掉线
      GOTRUE_JWT_EXP: "604800"
      # B40:C 端游客 JWT 密钥(独立于 GoTrue)。不设=空密钥,jose HMAC 抛「Zero-length key」→
      # 登录签发/校验全失败 → C 端 /api/c 鉴权整体 401(登录/预约/核销/我的预约不可用)。
      # 生产须用强随机值并随泄露轮换;Vercel env 同样必须配,否则真机小程序连登录都过不了。
      VISITOR_JWT_SECRET: ${VISITOR_JWT_SECRET:-changqiushan_visitor_dev_secret_2026}
      # 高德服务端 Web key(REST 路况/staticmap 代理),运行期注入;不设=诚实 unconfigured 态
      AMAP_KEY: ${AMAP_KEY:-}
      # B21:内网 http(VPN)QA 必须 false,否则浏览器不回传 secure cookie → 登录"没反应";
      # 生产经 https 反代时置 true(D4)。
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # R-storage:媒体直传必须的 S3/MinIO 配置(此前缺失→预签名直传永远失败)。
      # 服务端走容器内网 minio:9000;预签名给浏览器的 URL 必须用主机可达端点(VPN 10.7.0.1:9000)。
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://10.7.0.1:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-changqiushan}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-changqiushan_minio_dev}
      S3_BUCKET: ${S3_BUCKET:-changqiushan-media}
      S3_FORCE_PATH_STYLE: "true"
      # T2c 视频上传上限(字节):不透传则容器内永远走代码缺省 100MB(b-103 评审 #6)
      MAX_VIDEO_UPLOAD_BYTES: ${MAX_VIDEO_UPLOAD_BYTES:-}
    # 绑 0.0.0.0 以便经 VPN(10.7.0.1)访问;pg/gotrue 仅 127.0.0.1 不外露
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:18-alpine
    container_name: changqiushan-postgres
    restart: unless-stopped
    # 资源有限:硬上限 CPU/内存(docker compose up 直接生效),软预留用于调度
    cpus: 1.0
    mem_limit: 512m
    mem_reservation: 256m
    shm_size: 128m          # PG 并行/哈希用 /dev/shm,默认 64m 偏小
    environment:
      POSTGRES_USER: changqiushan
      POSTGRES_PASSWORD: changqiushan_dev
      POSTGRES_DB: changqiushan
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    # 把 PG 内存吃用调到与 512m 容器匹配(默认 shared_buffers/连接数会超)
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=48MB
      - -c
      - max_connections=40
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_worker_processes=4
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # PG 18 新约定:挂整个 /var/lib/postgresql,版本目录 18/docker/ 自动放数据
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U changqiushan -d changqiushan"]
      interval: 5s
      timeout: 3s
      retries: 10

  # GoTrue 自托管(D3):连同一 Postgres,独占 auth schema;签发/验 JWT、管密码与会话
  # 应用以 auth.users.id(UUID) 为身份单源,public 侧经只读视图缝合
  gotrue:
    image: supabase/gotrue:v2.176.1   # 钉死版本(升级会改 auth.users 列,需复验视图)
    container_name: changqiushan-gotrue
    restart: unless-stopped
    # GoTrue(Go,常驻内存小):给足量但封顶,避免异常时占满
    cpus: 0.5
    mem_limit: 128m
    mem_reservation: 64m
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:9999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:9999
      # 连库:用专用角色 supabase_auth_admin,GoTrue 默认 namespace=auth
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${GOTRUE_DB_PASSWORD}@postgres:5432/changqiushan?search_path=auth
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
      # E5/M1: 签发 iss 声明,与应用 session.ts/middleware.ts 的 issuer 校验对齐;
      # 缺此项时 GoTrue 不写 iss,应用侧 issuer 校验会拒签所有真实登录 token。
      GOTRUE_JWT_ISSUER: http://localhost:9999
      # 联调放宽:7 天,免得测试中频繁被踢去登录(B16)。⚠️ 生产应改回短时效(如 3600)+ 滑动续期(refresh_token)。
      GOTRUE_JWT_EXP: "604800"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      # 后台账号由管理员开通,关闭公开注册;登录标识符=手机号(关 email、开 phone)
      # 账号经 admin API 建并置 phone_confirm,登录走 手机号+密码,无需 SMS 网关
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"
      GOTRUE_LOG_LEVEL: info
      TZ: Asia/Shanghai

  # 媒体对象存储(S3 兼容)。富文本/封面图/视频上传落这里。
  # 选 MinIO 是因其走标准 S3 协议 → 上线可无缝切 腾讯云 COS / 阿里云 OSS(均兼容 S3),
  # 应用侧只需换 endpoint + access/secret key + bucket,driver(S3)不变。详见 docs R-storage。
  minio:
    image: minio/minio:latest   # TODO 上线前钉死 RELEASE 版本(对齐 pg/gotrue 钉版约定)
    container_name: changqiushan-minio
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 128m
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-changqiushan}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changqiushan_minio_dev}
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"            # S3 API:绑 0.0.0.0,媒体经 VPN(10.7.0.1:9000)可访问
      - "127.0.0.1:9001:9001"  # 控制台:仅本机
    volumes:
      - minio_data:/data

  # 一次性:等 MinIO 起来 → 建 media 桶 → 仅 public/ 前缀公共读(其余私有,走 presigned GET)
  # 目录治理: staging/(上传暂存) · public/(头像+公开内容图) · private/<module>/(私有)。详见 docs R-storage。
  minio-init:
    image: minio/mc:latest
    container_name: changqiushan-minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-changqiushan}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changqiushan_minio_dev}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do echo 'waiting minio...'; sleep 2; done;
        mc mb -p local/changqiushan-media || true;
        mc anonymous set none local/changqiushan-media || true;
        mc anonymous set download local/changqiushan-media/public || true;
        echo 'minio bucket ready: only public/ is public-read';
    restart: "no"

volumes:
  postgres_data:
  minio_data:

# 网络出网策略(b-103 评审 #8 / demo 服务器 156.229.22.155 修正):
# 历史上为绕「高德 v4 CDN 节点本地不可达」在默认网络开过 IPv6(配 NAT66 走宿主 v6 出网)。
# 但该方案只在宿主有可用公网 IPv6 时成立;迁到「仅 v4」主机(如本演示机)后,开 v6 反而给容器
# 一条指向黑洞 ULA 网关的 v6 默认路由——容器 fetch 高德优先选 v6 → 直接 ETIMEDOUT,路况/静态图全 502。
# 实测本机容器 IPv4 直连 restapi.amap.com 正常,故保持 IPv4-only(不声明 networks 段即默认 v4 网络)。
# 若迁回有公网 IPv6 + NAT66 的主机,可恢复:
#   networks:
#     default:
#       enable_ipv6: true
#       ipam: { config: [ { subnet: fd0c:7177:1::/64 } ] }

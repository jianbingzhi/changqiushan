services:
  postgres:
    image: postgres:18-alpine
    container_name: changqiushan-postgres
    restart: unless-stopped
    # 资源有限:硬上限 CPU/内存(docker compose up 直接生效),软预留用于调度
    cpus: 1.0
    mem_limit: 512m
    mem_reservation: 256m
    shm_size: 128m          # PG 并行/哈希用 /dev/shm,默认 64m 偏小
    environment:
      POSTGRES_USER: changqiushan
      POSTGRES_PASSWORD: changqiushan_dev
      POSTGRES_DB: changqiushan
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    # 把 PG 内存吃用调到与 512m 容器匹配(默认 shared_buffers/连接数会超)
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=48MB
      - -c
      - max_connections=40
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_worker_processes=4
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # PG 18 新约定:挂整个 /var/lib/postgresql,版本目录 18/docker/ 自动放数据
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U changqiushan -d changqiushan"]
      interval: 5s
      timeout: 3s
      retries: 10

  # GoTrue 自托管(D3):连同一 Postgres,独占 auth schema;签发/验 JWT、管密码与会话
  # 应用以 auth.users.id(UUID) 为身份单源,public 侧经只读视图缝合
  gotrue:
    image: supabase/gotrue:v2.176.1   # 钉死版本(升级会改 auth.users 列,需复验视图)
    container_name: changqiushan-gotrue
    restart: unless-stopped
    # GoTrue(Go,常驻内存小):给足量但封顶,避免异常时占满
    cpus: 0.5
    mem_limit: 128m
    mem_reservation: 64m
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:9999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:9999
      # 连库:用专用角色 supabase_auth_admin,GoTrue 默认 namespace=auth
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${GOTRUE_DB_PASSWORD}@postgres:5432/changqiushan?search_path=auth
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
      # E5/M1: 签发 iss 声明,与应用 session.ts/middleware.ts 的 issuer 校验对齐;
      # 缺此项时 GoTrue 不写 iss,应用侧 issuer 校验会拒签所有真实登录 token。
      GOTRUE_JWT_ISSUER: http://localhost:9999
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      # 后台账号由管理员开通,关闭公开注册;登录标识符=手机号(关 email、开 phone)
      # 账号经 admin API 建并置 phone_confirm,登录走 手机号+密码,无需 SMS 网关
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"
      GOTRUE_LOG_LEVEL: info
      TZ: Asia/Shanghai

volumes:
  postgres_data:

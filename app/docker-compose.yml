services:
  # B 端后台应用(Next 16 生产构建)。QA/联调用,完全容器化跑全栈。
  # 构建是重活:按 CLAUDE.md「编译/打包纪律」先 down 释放内存再 build app,再 up。
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: changqiushan-app:latest
    container_name: changqiushan-app
    restart: unless-stopped
    # 运行期(next start)内存占用温和;构建期重活在 image build 阶段,不受此 limit 约束
    cpus: 1.0
    mem_limit: 640m
    mem_reservation: 256m
    depends_on:
      postgres:
        condition: service_healthy
      gotrue:
        condition: service_started
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      # 容器内网:DB 主机名=postgres、端口=5432(非宿主映射的 5433)
      DATABASE_URL: postgresql://changqiushan:changqiushan_dev@postgres:5432/changqiushan?schema=public
      # fetch GoTrue 走容器内网名;但 issuer 必须仍 = GoTrue 签发的 iss(localhost:9999),否则验签拒所有真实 token
      GOTRUE_URL: http://gotrue:9999
      GOTRUE_JWT_ISSUER: http://localhost:9999
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
    # 绑 0.0.0.0 以便经 VPN(10.7.0.1)访问;pg/gotrue 仅 127.0.0.1 不外露
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:18-alpine
    container_name: changqiushan-postgres
    restart: unless-stopped
    # 资源有限:硬上限 CPU/内存(docker compose up 直接生效),软预留用于调度
    cpus: 1.0
    mem_limit: 512m
    mem_reservation: 256m
    shm_size: 128m          # PG 并行/哈希用 /dev/shm,默认 64m 偏小
    environment:
      POSTGRES_USER: changqiushan
      POSTGRES_PASSWORD: changqiushan_dev
      POSTGRES_DB: changqiushan
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    # 把 PG 内存吃用调到与 512m 容器匹配(默认 shared_buffers/连接数会超)
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=48MB
      - -c
      - max_connections=40
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_worker_processes=4
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # PG 18 新约定:挂整个 /var/lib/postgresql,版本目录 18/docker/ 自动放数据
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U changqiushan -d changqiushan"]
      interval: 5s
      timeout: 3s
      retries: 10

  # GoTrue 自托管(D3):连同一 Postgres,独占 auth schema;签发/验 JWT、管密码与会话
  # 应用以 auth.users.id(UUID) 为身份单源,public 侧经只读视图缝合
  gotrue:
    image: supabase/gotrue:v2.176.1   # 钉死版本(升级会改 auth.users 列,需复验视图)
    container_name: changqiushan-gotrue
    restart: unless-stopped
    # GoTrue(Go,常驻内存小):给足量但封顶,避免异常时占满
    cpus: 0.5
    mem_limit: 128m
    mem_reservation: 64m
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:9999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:9999
      # 连库:用专用角色 supabase_auth_admin,GoTrue 默认 namespace=auth
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${GOTRUE_DB_PASSWORD}@postgres:5432/changqiushan?search_path=auth
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
      # E5/M1: 签发 iss 声明,与应用 session.ts/middleware.ts 的 issuer 校验对齐;
      # 缺此项时 GoTrue 不写 iss,应用侧 issuer 校验会拒签所有真实登录 token。
      GOTRUE_JWT_ISSUER: http://localhost:9999
      # 联调放宽:7 天,免得测试中频繁被踢去登录(B16)。⚠️ 生产应改回短时效(如 3600)+ 滑动续期(refresh_token)。
      GOTRUE_JWT_EXP: "604800"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      # 后台账号由管理员开通,关闭公开注册;登录标识符=手机号(关 email、开 phone)
      # 账号经 admin API 建并置 phone_confirm,登录走 手机号+密码,无需 SMS 网关
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"
      GOTRUE_LOG_LEVEL: info
      TZ: Asia/Shanghai

  # 媒体对象存储(S3 兼容)。富文本/封面图/视频上传落这里。
  # 选 MinIO 是因其走标准 S3 协议 → 上线可无缝切 腾讯云 COS / 阿里云 OSS(均兼容 S3),
  # 应用侧只需换 endpoint + access/secret key + bucket,driver(S3)不变。详见 docs R-storage。
  minio:
    image: minio/minio:latest   # TODO 上线前钉死 RELEASE 版本(对齐 pg/gotrue 钉版约定)
    container_name: changqiushan-minio
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 128m
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-changqiushan}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changqiushan_minio_dev}
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"            # S3 API:绑 0.0.0.0,媒体经 VPN(10.7.0.1:9000)可访问
      - "127.0.0.1:9001:9001"  # 控制台:仅本机
    volumes:
      - minio_data:/data

  # 一次性:等 MinIO 起来 → 建 media 桶 → 仅 public/ 前缀公共读(其余私有,走 presigned GET)
  # 目录治理: staging/(上传暂存) · public/(头像+公开内容图) · private/<module>/(私有)。详见 docs R-storage。
  minio-init:
    image: minio/mc:latest
    container_name: changqiushan-minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-changqiushan}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changqiushan_minio_dev}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do echo 'waiting minio...'; sleep 2; done;
        mc mb -p local/changqiushan-media || true;
        mc anonymous set none local/changqiushan-media || true;
        mc anonymous set download local/changqiushan-media/public || true;
        echo 'minio bucket ready: only public/ is public-read';
    restart: "no"

volumes:
  postgres_data:
  minio_data:
